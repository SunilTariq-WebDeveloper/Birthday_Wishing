<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎂 Birthday Wisher | Constant Name Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Main Card */
        .birthday-card {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.3);
            z-index: 20;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .birthday-card:hover {
            transform: translateY(-5px);
        }

        /* Animated elements */
        .cake-icon {
            font-size: 5rem;
            animation: bounce 2s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(5deg);
            }
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(120deg, #FFE66D, #FF6B6B, #FF8E53);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0.5rem 0;
            font-weight: 800;
        }

        .subtitle {
            color: #FFF9E6;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            margin-bottom: 1.5rem;
        }

        /* Person Display */
        .person-card {
            background: linear-gradient(135deg, rgba(255, 215, 150, 0.9), rgba(255, 180, 100, 0.9));
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin: 1.5rem 0;
            backdrop-filter: blur(5px);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #5a2a0a;
            font-weight: 600;
        }

        .constant-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 3px 3px 0 #e67e22;
            margin: 0.5rem 0;
            word-break: break-word;
        }

        /* Wish Message Box */
        .wish-box {
            background: white;
            border-radius: 1.5rem;
            padding: 1.8rem;
            margin: 1.5rem 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.4s ease;
        }

        .greeting {
            font-size: 1.4rem;
            color: #e67e22;
            font-weight: 600;
        }

        .wish-text {
            font-size: 1.2rem;
            color: #2c3e50;
            margin: 1rem 0;
            line-height: 1.5;
            font-weight: 500;
        }

        .emoji-row {
            font-size: 2rem;
            letter-spacing: 8px;
            margin-top: 0.5rem;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .btn-wish {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-wish:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-celebrate {
            background: linear-gradient(135deg, #FFD93D, #FFB347);
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            color: #5a2a0a;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-celebrate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-reset {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid white;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        /* Animation for wish */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wish-box {
            animation: slideIn 0.5s ease-out;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #FFE6CC;
        }

        @media (max-width: 550px) {
            .birthday-card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .constant-name {
                font-size: 1.8rem;
            }

            .wish-text {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
        
    <canvas id="confetti-canvas"></canvas>

    <div class="birthday-card">
        <div class="cake-icon">🎂🎈🎁</div>
        <h1>Birthday Wisher</h1>
        <div class="subtitle">✨ Make Someone's Day Magical ✨</div>

        <!-- Constant Name Display -->
        <div class="person-card">
            <div class="label">🎉 Celebrating 🎉</div>
            <div class="constant-name" id="constantNameDisplay">Loading...</div>
            <div class="label">💝 Birthday Star 💝</div>
        </div>

        <!-- Wish Message Container -->
        <div id="wishContainer">
            <div class="wish-box" id="wishMessageBox" style="display: none;">
                <div class="greeting">🎊 Happy Birthday! 🎊</div>
                <div class="wish-text" id="wishMessageText">
                    May your day be filled with joy, laughter, and unforgettable moments!
                </div>
                <div class="emoji-row">🎉 🎂 🎈 🎁 🎊</div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <button class="btn-wish" id="wishBtn">🎂 Send Birthday Wish 🎂</button>
            <button class="btn-celebrate" id="celebrateBtn">🎆 Celebrate with Confetti 🎆</button>
            <button class="btn-reset" id="resetBtn">🔄 Hide Wish</button>
        </div>

        <footer>💖 A special birthday wish for a special person! Click the button to wish! 💖</footer>
    </div>

    <script>
        // ===========================================
        // ⭐ CONSTANT NAME - CHANGE HERE ONLY ⭐
        // ===========================================
        const BIRTHDAY_PERSON_NAME = "Sir Bilal Hussain";  // 👈 Apni marzi ka name yahan likhein!
        // ===========================================

        // Beautiful birthday messages collection
        const birthdayMessages = [
            "🎂 May your day be as sweet as cake and as bright as candles! Wishing you a fantastic year ahead! 🌟",
            "🎈 Another trip around the sun! May this year bring you endless joy, success, and happiness! 🚀",
            "🎁 You're not just a year older, you're a year better! Keep shining and spreading smiles! ✨",
            "🎉 Party time! May all your dreams come true and your heart be filled with love today and always! 💖",
            "🌸 Wishing you a birthday as wonderful and special as you are! Enjoy every moment! 🎂",
            "🌟 Today the world celebrates YOU! May laughter and love surround you on your special day! 🎊",
            "🍰 Age is just a number, but your awesomeness is timeless! Have a blast! 🎈",
            "💫 May the candles on your cake light up your path to an amazing year! Happy Birthday! 🎂",
            "🎨 You paint our lives with happiness! Today, we celebrate the masterpiece that is YOU! 🖼️",
            "🌈 Sending you a rainbow of good wishes, a sky full of happiness, and a lifetime of smiles! 🎁"
        ];

        // Get random birthday message
        function getRandomBirthdayMessage(name) {
            const randomIndex = Math.floor(Math.random() * birthdayMessages.length);
            let message = birthdayMessages[randomIndex];
            // Insert name in message if it contains placeholder or just add at start
            if (!message.includes(name)) {
                message = `✨ Dear ${name}, ✨ ` + message;
            }
            return message;
        }

        // DOM Elements
        const constantNameDisplay = document.getElementById('constantNameDisplay');
        const wishMessageBox = document.getElementById('wishMessageBox');
        const wishMessageText = document.getElementById('wishMessageText');
        const wishBtn = document.getElementById('wishBtn');
        const celebrateBtn = document.getElementById('celebrateBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Set the constant name in display
        constantNameDisplay.textContent = BIRTHDAY_PERSON_NAME;

        // ========== CONFETTI SYSTEM (Professional & Smooth) ==========
        const canvas = document.getElementById('confetti-canvas');
        let ctx = canvas.getContext('2d');
        let animationId = null;
        let particles = [];
        let confettiActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        class ConfettiPiece {
            constructor(x, y, size, color, speedX, speedY, rotation, rotationSpeed) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.speedX = speedX;
                this.speedY = speedY;
                this.rotation = rotation;
                this.rotationSpeed = rotationSpeed;
                this.alpha = 1;
                this.gravity = 0.2;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                this.speedX *= 0.99;
                this.speedY *= 0.99;
                this.alpha *= 0.995;
                return (this.y < canvas.height + 200 && this.x > -200 && this.x < canvas.width + 200 && this.alpha > 0.01);
            }

            draw(context) {
                context.save();
                context.translate(this.x, this.y);
                context.rotate(this.rotation);
                context.globalAlpha = this.alpha * 0.8;
                context.fillStyle = this.color;
                context.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                context.restore();
            }
        }

        function spawnConfetti(count = 150, intensity = 1.0) {
            if (!ctx) return;
            const finalCount = Math.min(300, Math.floor(count * intensity));
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF8C42', '#D4AF37', '#F4A261', '#E9C46A', '#2A9D8F', '#E76F51', '#9B59B6', '#3498DB'];

            for (let i = 0; i < finalCount; i++) {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height - canvas.height * 0.2;
                const size = 5 + Math.random() * 12;
                const speedX = (Math.random() - 0.5) * 7;
                const speedY = (Math.random() - 0.5) * 5 + 2;
                const rotation = Math.random() * Math.PI * 2;
                const rotationSpeed = (Math.random() - 0.5) * 0.2;
                particles.push(new ConfettiPiece(x, y, size, randomColor, speedX, speedY, rotation, rotationSpeed));
            }

            if (!confettiActive && particles.length > 0) {
                confettiActive = true;
                startConfettiAnimation();
            }
        }

        function startConfettiAnimation() {
            if (animationId) cancelAnimationFrame(animationId);

            function animateConfetti() {
                if (!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let anyAlive = false;

                for (let i = particles.length - 1; i >= 0; i--) {
                    const alive = particles[i].update();
                    particles[i].draw(ctx);
                    if (alive) anyAlive = true;
                    else particles.splice(i, 1);
                }

                if (anyAlive || particles.length > 0) {
                    animationId = requestAnimationFrame(animateConfetti);
                } else {
                    confettiActive = false;
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateConfetti();
        }

        function burstConfetti(intensity = 1) {
            spawnConfetti(180, intensity);
            setTimeout(() => {
                spawnConfetti(80, intensity * 0.7);
            }, 150);
        }

        // ========== BIRTHDAY WISH FUNCTION ==========
        function sendBirthdayWish() {
            // Get random message
            const message = getRandomBirthdayMessage(BIRTHDAY_PERSON_NAME);
            wishMessageText.textContent = message;

            // Show wish box with animation
            if (wishMessageBox.style.display === 'none') {
                wishMessageBox.style.display = 'block';
            } else {
                // Replay animation
                wishMessageBox.style.animation = 'none';
                setTimeout(() => {
                    wishMessageBox.style.animation = 'slideIn 0.5s ease-out';
                }, 10);
            }

            // Burst confetti on wish
            burstConfetti(1.2);

            // Add a little bounce effect on card
            const card = document.querySelector('.birthday-card');
            card.style.transform = 'scale(1.02)';
            setTimeout(() => {
                card.style.transform = '';
            }, 300);

            // Optional: Show a sweet console message
            console.log(`🎉 Happy Birthday ${BIRTHDAY_PERSON_NAME}! 🎉`);
        }

        // Extra celebration (just confetti + fun)
        function extraCelebration() {
            burstConfetti(1.5);

            // Add temporary excitement message if wish is visible
            if (wishMessageBox.style.display !== 'none') {
                const originalText = wishMessageText.textContent;
                wishMessageText.textContent = originalText + " 🎉✨ PARTY MODE ACTIVATED! ✨🎉";
                setTimeout(() => {
                    if (wishMessageText.textContent.includes("PARTY MODE ACTIVATED")) {
                        wishMessageText.textContent = originalText;
                    }
                }, 2000);
            } else {
                // If no wish showing, show a floating hint
                const hint = document.createElement('div');
                hint.textContent = "🎊 Click 'Send Birthday Wish' first for full celebration! 🎊";
                hint.style.position = 'fixed';
                hint.style.bottom = '20px';
                hint.style.left = '50%';
                hint.style.transform = 'translateX(-50%)';
                hint.style.background = 'rgba(0,0,0,0.8)';
                hint.style.color = '#FFE66D';
                hint.style.padding = '10px 20px';
                hint.style.borderRadius = '50px';
                hint.style.fontSize = '0.9rem';
                hint.style.zIndex = '1000';
                hint.style.fontWeight = 'bold';
                hint.style.backdropFilter = 'blur(10px)';
                document.body.appendChild(hint);
                setTimeout(() => {
                    hint.style.opacity = '0';
                    setTimeout(() => hint.remove(), 500);
                }, 2000);
            }

            // Card shake effect
            const card = document.querySelector('.birthday-card');
            card.style.transform = 'translateY(-3px)';
            setTimeout(() => {
                card.style.transform = '';
            }, 200);
        }

        // Reset (hide wish box)
        function resetWish() {
            wishMessageBox.style.display = 'none';
            // Optional: reset message to default
            wishMessageText.textContent = "May your day be filled with joy, laughter, and unforgettable moments!";
        }

        // Event Listeners
        wishBtn.addEventListener('click', sendBirthdayWish);
        celebrateBtn.addEventListener('click', extraCelebration);
        resetBtn.addEventListener('click', resetWish);

        // Initialize canvas size
        resizeCanvas();

        // Small welcome confetti after page loads (just for fun)
        setTimeout(() => {
            if (!confettiActive) {
                spawnConfetti(40, 0.4);
            }
        }, 500);

        // Display name with style on console (developer love)
        console.log(`%c🎂 HAPPY BIRTHDAY ${BIRTHDAY_PERSON_NAME}! 🎂`, 'color: #FF6B6B; font-size: 16px; font-weight: bold;');
        console.log('%cBirthday Wisher App Ready!', 'color: #4ECDC4; font-size: 14px;');
    </script>
</body>

</html>
